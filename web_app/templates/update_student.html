<!DOCTYPE html>
<html>
<head>
    <title>Update Student</title>
</head>

<body>

<h1>Update Student</h1>

<form method="POST">

    <input type="text"
           name="name"
           value="{{ student.name }}">

    <br><br>

    <input type="text"
           name="department"
           value="{{ student.department }}">

    <br><br>

    <button type="submit">
        Update
    </button>

</form>

</body>
</html>
