<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>

<body>

    <h1>Register User</h1>

    <form method="POST">

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <br><br>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <br><br>
        <label>Select Role:</label> 
        <select name="role"> 
            <option value="student"> 
                Student 
            </option> 
            <option value="teacher"> 
                Teacher 
            </option> 
            <option value="admin"> 
                Admin 
            </option> 
        </select> 
        <br><br>
        <button type="submit">Register</button>

    </form>

    <h3>{{ message }}</h3>

    <br>

    <a href="/">Go to Login</a>

</body>
</html>
