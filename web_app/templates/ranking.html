<!DOCTYPE html>
<html>
<head>
    <title>Ranking</title>
</head>

<body>

    <h1>Student Ranking</h1>

    <hr>

    {% for item in students %}

        <h2>
            Rank {{ loop.index }}
        </h2>

        <h3>{{ item.student.name }}</h3>

        <p>ID: {{ item.student.student_id }}</p>

        <p>Average: {{ item.average }}</p>

        <hr>

    {% endfor %}

    <a href="/dashboard">
        Back to Dashboard
    </a>

</body>
</html>
